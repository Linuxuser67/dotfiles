# Match uosc video/audio types so autoload doesn't skip extensions
# that uosc itself supports (e.g. ts, vob, rm, ts, m2ts variants).
disabled=no
images=no
videos=yes
audio=yes
additional_video_exts=ts,m2ts,vob,rm,asf,f4v,h264,h265,mpeg,mpg,ogm,y4m
additional_audio_exts=cue,dsf,dts,mid,midi,spx,tak,tta,weba
ignore_hidden=yes
same_type=no
directory_mode=recursive
